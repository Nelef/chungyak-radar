# ── 청약 레이더 필터 설정 ──────────────────────────────────
poll_interval_minutes: 60

# premarital = 혼인신고 전(각자 2장 전략) / married = 기혼(신혼·생초 특공)
# 혼인신고 하는 날 이 값만 married로 바꾸면 알림 태그가 전환됨
mode: premarital

# 텔레그램 알림에 넣을 대시보드 링크(선택)
dashboard_url: ""

# 내 청약 조건 — 공고 분석 · 임대 판단 프롬프트와 소득 태그에 쓰인다. 계좌번호 같은 민감 정보는 넣지 말 것.
profile:
  household: 예) 무주택 1인 가구 / 예비신혼부부(혼인신고 전, 각자 세대주)
  annual_income_manwon: 0           # 가구 합산 연소득(만원)
  income_2025_won:                  # 총급여(원, 원천징수영수증) - 참고 · 교차검증용
    me: 0
    spouse: 0
  health_pay_monthly_won:           # 건강보험 보수월액(원/월) - 공공임대 소득 심사에 실제로 쓰이는 값
    me: 0
    spouse: 0
    checked_at: ''
  savings_account:                  # 청약통장(순위기산일 · 납입 인정 회차 · 금액)
    me:
      rank_base_date: ''
      paid_count: 0
      recognized_won: 0
    spouse:
      product: ''
      rank_base_date: null
      paid_count: 0
      balance_won: 0
      monthly_won: 0
    checked_at: ''
  wish: 예) 분양 우선, 전용 59㎡ 이상, 통근 목적지까지 지하철 1시간 이내

income_standard_2025:
  pct100: {1: 3813363, 2: 5866270, 3: 8168429, 4: 8802202, 5: 9326985}

# 유형별 소득 상한(원/월). 2인 가구·맞벌이·무자녀 기준, 각 공고문 원문에서 확인한 절대금액.
# ★ 반드시 금액으로 관리할 것. '%' 표기는 공고마다 2인 가산 포함 여부가 달라 서로 비교가 안 된다.
#   예) 행복주택 "맞벌이 2인 130%" = 2인기준×1.3 = 7,626,151
#       청년안심 신혼Ⅱ "130% 이하" 2인 = 2인기준×1.4 = 8,212,778 (가산을 표에 이미 반영)
#   같은 "130%"인데 금액이 다르다. 예전에 %로 하드코딩해 행복주택을 '초과'로 오판했다.
income_limit_2p_dual:
  행복주택:            7626151   # 과천 신혼희망타운 행복주택(2026.07.31) p.6 '맞벌이 2인 130%'
  청년안심_신혼1:      5866270   # SH 2026-2차 청년안심(공공임대) p.36 '70%(배우자 소득 시 90%)' 2인
  청년안심_신혼2:      8212778   # 같은 공고 p.38 '130% 이하' 2인
  청년안심_신혼2_최대: 12319167  # 같은 표 '배우자 소득 있는 경우 200%' 2인
  # ※ 공공지원민간임대는 이 금액이 '특별공급(약 20%)' 기준이다.
  #    일반공급(약 80%)은 "소득 및 자산, 지역 요건 없음"인 공고가 많다
  #    (강변역 강변 스카이타워 2026.07.28 '■ 일반공급 신청자격 ④' 명시).
  공공지원민간임대:    7039524   # 연신내역 루체스테이션(2026.07.30) 3순위 120% 2인
  청년_1인:            4576036   # 1인 가구 120% — 청년 계층 3순위 / 민간임대 3순위 공통

regions:
  seoul: true                       # 서울 전 지역 (당해 우선 태그)
  gyeonggi_all: true                # 경기 전역 허용(도시 지정 대신). 통근 초과는 아래 통근필터로 제외
  gyeonggi_cities:                  # gyeonggi_all=false일 때만 쓰는 화이트리스트
    - 부천
    - 하남
    - 과천
    - 성남
    - 광명
    - 안양
    - 의왕

# LH·GH 임대 중 수집할 유형. 자격 판단은 rules.py가 유형별 소득요건 태그로 안내한다
# (profile 소득 기준으로 ✅가능/⚠️초과 표시). 영구임대(취약계층)·국민임대(소득 초과) 제외.
# ※ 부분일치(LIKE)로 매칭하므로 '행복주택(신혼희망)'은 아래 '행복주택'에 걸린다
#   (LH 신혼희망타운 = API 상위유형 39. sources.py의 LH_UPP_RENT 참고)
# ※ LH 매입임대·전세임대(청년·신혼부부)는 아직 미포함 — 추가하면 소득요건 초과 유형까지
#   들어와 알림이 늘어나므로 보류 상태. 넣을 때는 소득 판정 태그를 함께 손볼 것.
lh_gh_rent_types:
  - 행복주택
  - 통합공공임대
  - 공공임대
  - 6년 공공임대
  - 장기전세

# 관심단지 — 공고 이름(공백 제거 후)에 포함되면 지역·통근 필터를 건너뛰고 ⭐ 태그 + 신규 텔레그램 알림.
# 통근 60분 초과로 걸러지던 운정(GTX 삼성역 개통 대기)·광교를 놓치지 않으려고 추가(2026-10-19).
# '시티프라디움'처럼 브랜드만 쓰면 다른 지역 단지까지 걸리므로 지명+단지명으로 적을 것.
watchlist:                          # 예) 운정중앙역시티프라디움 - 지명+단지명으로 적을 것
  - 예시단지명

exclude_keywords:                   # 이름에 포함되면 제외
  - 오피스텔
  - 도시형생활주택
  - 생활숙박
  - 토지임대부                      # 사용자 선호(2026-10-17): 토지임대료가 2년마다 오르는 구조라 제외

# 게시판(SH·청년안심) 전용: 모집공고가 아닌 후속 게시글(발표·안내·경쟁률 등) 제외.
# 이런 글은 접수일정이 없어 '접수 확인'으로 잘못 떠서 대시보드를 오염시킴.
board_exclude_keywords:
  - 발표
  - 경쟁률
  - 사전점검
  - 사전방문
  - 서류심사
  - 주택공개
  - 당첨자
  - 예비입주자
  - 임대상가                        # SH isRecrnoti=Y에 섞여 오는 상가 재공급 제외
  - 입주안내                        # 분양 게시판(m_244)의 '○○ 입주안내문 게시' 후속글 제외
  # ── 2026-10-19 점검에서 '접수 확인'/'?'로 떠 있던 후속·안내글 (비교는 띄어쓰기 무시) ──
  - 결과                            # '청약접수 결과안내', '1순위 청약접수 결과 및 2순위…'
  - 접수마감                        # '선순위 청약접수결과 및 접수마감 안내'
  - 안내문                          # '입주 안내문 게시', '재계약 안내(정정 안내문)'
  - 재계약
  - 공급일정 변경                   # '미리내집 예비자 공급일정 변경 안내'
  - 알려드립니다                    # '…모두 확장형임을 알려드립니다'
  - 분양가격 공개                   # '평균 건물분양가격 공개'(모집공고 아님)
  - 근생시설                        # 근린생활시설 임차인 모집(상가)
  - 토지임대부                      # 사용자 선호: 토지임대부 분양 제외(2026-10-17)
  - 어르신                          # 은평 홀몸어르신 은빛주택 등 고령자 전용(대상 아님)
  - 도전숙                          # 청년 창업가 전용(수요자맞춤) — '창업인'과 같은 이유
  # ── 조합 가입·공동체 활동이 요구되는 커뮤니티형(사용자 요청으로 제외) ──
  - 협동조합                        # 예술인·육아·청년 협동조합주택, 이웃기웃, 한지붕 등
  - 두레주택                        # 충신동 두레주택 등(공동체 활동 의무)
  - 사회주택                        # 토지임대부 사회주택(옥류서원·유니버설하우징 등)
  - 연극인                          # 성북구 연극인주택
  - 예술인                          # 만리동 예술인 주택
  - 창업인                          # 은평 청년 창업인의 집

reminders: [7, 1]                   # 접수 시작·마감 D-7, D-1 아침 8:30 알림

# 임대 공고 '지원할 만한가' — NAS Claude 판단(app/rent_review.py, 2026-10-27 사용자 요청).
# 이 면적 이상 공급 타입이 없으면 새 공고 알림 · 아침 리마인더에서 뺀다. 추천 · 검토만 알림.
# 2026-11-09 사용자 "49이상으로 잡자 이제. 59가 아니라." — 바꾸면 면적 미달이던 판단만 다음 수집 때 다시 받는다.
rent_review:
  min_area_m2: 49

# 구글 캘린더 구독용 .ics (GET /cal/<CAL_TOKEN>.ics, app/ical.py) — 분양 공고 접수·발표만.
# 임대 · 알림 끈 공고 제외, 정정공고는 최신 1건, 일정이 같은 회차는 1건으로 자동 정리.
calendar:
  name: 청약 레이더 (자동)
  past_days: 7                      # 지난 일정은 이만큼까지만 남김
  future_days: 180
  skip_ids: []                      # 메인 캘린더에 직접 넣은 공고 id(중복 방지), 예) applyhome:2026000517

commute:                            # 통근 목적지(COMMUTE_DEST_NAME · _X · _Y 환경변수) 지하철+도보 소요시간
  enabled: true
  max_minutes: 60                   # 초과 시 ⚠ 경고 태그
  exclude_over: true                # 60분 초과는 알림·목록에서 제외(경기 전역 허용과 짝) — 2026-10-27 사용자 '60분 넘으면 빼'
                                    # 지오코딩 실패(주소 불명)는 판단 불가라 제외하지 않고 남긴다

# 분양가/필요현금 계산 (청약홈 APT) — homedubu 방식
# 계약 최소현금 = 계약금 + 중도금 자납분 / 입주 자기자본 = 분양가 − 주담대(LTV)
# 계약금율·중도금 자납비율은 LLM(Kimi)이 공고문 PDF에서 추출(미설정 시 아래 가정치),
# 없으면 fallback_contract_pct 가정치로 폴백. LTV는 정책 따라 바뀌니 직접 관리.
cost:
  enabled: true
  ltv_regulated: 40                 # 규제지역 주담대 LTV %
  ltv_normal: 70                    # 비규제 주담대 LTV %
  loan_cap_manwon: 60000            # 일반 분양 주담대 절대한도(만원). 6·27 대책: 수도권·규제지역
                                    # 주택구입 주담대 6억 상한(15억 이하 기준). min(LTV, 6억) 적용.
                                    # (15~25억 4억 / 25억 초과 2억 차등은 미반영 — 대상 가격대가 대부분 15억↓)
  hopetown_ltv: 70                  # 신혼희망타운 수익공유형 모기지 LTV %
  hopetown_loan_cap_manwon: 40000   # 신희타 모기지 정액 한도(4억)
  min_area_m2: 49                   # 전용 49㎡ 이상 주택형만 필요현금 계산(전부 소형이면 전체)
  highlight_under_manwon: 20000     # 필요현금 2억 미만이면 🔥 강조
  fallback_contract_pct: 10         # 공고문 추출 실패 시 계약금 가정 %

# 게시판 소스 (SH·청년안심 임대 공고) — 게시판 개편 시 URL/타입만 수정
# type: soco_json = 청년안심주택 포털(목록이 bbsListJson.json AJAX로 내려옴)
#       sh_board  = SH 공고(글 링크가 onclick=getDetailView('seq') 방식)
#       anchor    = 단순 a[href] 게시판 폴백
boards:
  - name: 청년안심주택 포털
    type: soco_json
    json_url: https://soco.seoul.go.kr/youth/pgm/home/yohome/bbsListJson.json
    bbs_id: BMSR00015
    view_url: https://soco.seoul.go.kr/youth/bbs/BMSR00015/view.do?menuNo=400008&boardId={id}
    # 2페이지만 보다가, 3페이지 이후로 밀려난 옛 공고가 DB에 '마감일 없음' 상태로 굳어
    # 접수중으로 계속 뜨는 문제가 있었다(2026-08, 18건). 파서를 고쳐도 재수집이 안 되면
    # 갱신되지 않는다. 한 페이지 10건이고 deactivate_stale_boards가 45일로 정리하므로
    # 5페이지(≈50건 ≈ 6주)면 정리 주기와 맞는다.
    pages: 5
    keywords: [모집공고, 입주자 모집, 청년안심]
  - name: SH 공고
    type: sh_board
    list_url: https://www.i-sh.co.kr/main/lay2/program/S1T294C297/www/brd/m_247/list.do
    base_url: https://www.i-sh.co.kr
    pages: 1                         # isRecrnoti=Y(접수중 모집공고) 1페이지면 현재 접수중이 다 들어옴
                                     # (2페이지는 오래된 예비/상시 공고가 섞여 날짜 오추출 유발)
    keywords: [미리내집, 장기전세, 신혼, 청년안심, 입주자 모집, 모집공고]
  # SH 주택분양 게시판. 위 m_247은 '주택임대'라 분양 공고가 통째로 사각지대였다.
  # 토지임대부 분양주택·공공분양·잔여세대와 일부 공공지원민간임대(성동스페이스 등)가 여기로 온다.
  # sale: true → 분양 태그(청약통장 사용·재당첨 제한)를 붙인다. 임대 태그를 쓰면 정반대 안내가 나감.
  - name: SH 분양공고
    type: sh_board
    sale: true
    list_url: https://www.i-sh.co.kr/app/lay2/program/S48T561C562/www/brd/m_244/list.do
    base_url: https://www.i-sh.co.kr
    pages: 2                         # m_244는 isRecrnoti 파라미터를 무시하므로 2페이지까지 본다
    keywords: [모집공고, 입주자 모집, 토지임대, 분양주택, 미리내집, 장기전세, 신혼, 청년안심]
  # 중소벤처기업부 서울청 '주택특별공급' 게시판 — 중소기업 장기근속자 우선공급(기관추천) 안내.
  # 임대가 아니라 분양 특공이라 mss_board가 flags 분양=True로 넣는다(임대 태그 방지).
  # 기관추천은 회사 통해 신청하는 흐름이라 물량 포착·알림 용도.
  - name: 중기청 주택특공
    type: mss_board
    list_url: https://www.mss.go.kr/site/seoul/ex/bbs/List.do?cbIdx=359
    keywords: [우선공급, 특별공급, 장기근속, 모집]
