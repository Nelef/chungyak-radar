<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청약 레이더</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --ink:#17233B; --muted:#66707F;
  --line:#DCE1E8; --red:#C8402A; --green:#1F7A54; --navy:#26436E;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
.wrap{max-width:760px; margin:0 auto; padding:0 16px 80px}

header{padding:26px 0 14px; display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.brand{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:26px; letter-spacing:-.5px}
.brand em{font-style:normal; color:var(--red)}
.sync{font-size:12px; color:var(--muted); text-align:right}
.sync button{margin-left:8px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); border-radius:6px; padding:4px 10px; font:inherit; font-size:12px; cursor:pointer}
.sync button:hover{border-color:var(--navy)}
.sync button:focus-visible{outline:2px solid var(--navy); outline-offset:2px}

.statusbar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.pill{font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--muted)}
.pill.ok{border-color:#BFDCCB; color:var(--green); background:#F1F8F4}
.pill.warn{border-color:#EAC5BC; color:var(--red); background:#FBF2F0}

.tabs{display:flex; gap:2px; border:1px solid var(--line); background:var(--card);
  border-radius:8px; padding:3px; margin-bottom:16px; width:max-content}
.tabs button{border:0; background:transparent; padding:6px 14px; border-radius:6px;
  font:inherit; font-size:13px; color:var(--muted); cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink); color:#fff}
.tabs button:focus-visible{outline:2px solid var(--navy); outline-offset:2px}

.card{position:relative; display:flex; gap:14px; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:16px; margin-bottom:10px}
.mutebtn{position:absolute; top:10px; right:10px; z-index:1; font:inherit; font-size:11px;
  padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff;
  color:var(--muted); cursor:pointer; white-space:nowrap}
.mutebtn:hover{border-color:var(--navy); color:var(--navy)}
.mutebtn.on{border-color:#EAC5BC; color:var(--red); background:#FBF2F0}
.card.muted{opacity:.62}
.card.muted .name{padding-right:88px}
.muted-note{font-size:12px; color:var(--muted); margin-top:4px}
.dday{flex:0 0 74px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-right:1px solid var(--line); padding-right:14px}
.dday .num{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.5px; line-height:1.1; white-space:nowrap}
.dday .lbl{font-size:11px; color:var(--muted); margin-top:2px; text-align:center}
.dday.open .num{color:var(--green)}
.dday.soon .num{color:var(--red)}
.dday.later .num{color:var(--navy)}
.dday.result .num{color:var(--navy); opacity:.6}
.dday.done .num{color:var(--muted)}

.body{flex:1; min-width:0}
.name{font-weight:700; font-size:16px; letter-spacing:-.2px}
.name a{color:inherit; text-decoration:none}
.name a:hover{text-decoration:underline}
.meta{font-size:13px; color:var(--muted); margin:2px 0 10px}

.timeline{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; padding:8px 0;
  border-top:1px dashed var(--line); border-bottom:1px dashed var(--line)}
.timeline .step{display:flex; align-items:center; gap:6px; color:var(--muted); font-variant-numeric:tabular-nums}
.timeline .step b{color:var(--ink); font-weight:500}
.timeline .step::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--line)}
.timeline .step.now::before{background:var(--green)}
.timeline .step.next::before{background:var(--red)}

.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tag{font-size:12px; padding:2px 9px; border-radius:4px; background:#EEF1F5; color:#3C4A63}
.tag.warn{background:#FBF2F0; color:var(--red)}
.tag.cost{background:#EAF3EE; color:var(--green)}
.tag.hot{background:#FFF3D6; color:#8A6A00; font-weight:700; border:1px solid #E7C766}
.maplink{color:var(--navy); text-decoration:none; font-weight:500; white-space:nowrap}
.maplink:hover{text-decoration:underline}

.settings{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px}
.settings h3{font-size:14px; margin-bottom:4px}
.settings label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px}
.settings input,.settings select{width:100%; padding:7px 9px; border:1px solid var(--line);
  border-radius:6px; font:inherit; font-size:13px; background:#fff; color:var(--ink)}
.settings .row{display:flex; gap:10px}
.settings .row>div{flex:1; min-width:0}
.settings .save{margin-top:12px; background:var(--navy); color:#fff; border:0; border-radius:6px;
  padding:8px 16px; font:inherit; cursor:pointer}
.settings .hint{font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5}

.toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.filterbar{display:flex; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap; font-size:13px}
.fchk{display:inline-flex; align-items:center; gap:6px; color:var(--ink); cursor:pointer}
.fchk input[type=number]{width:56px; border:1px solid var(--line); border-radius:6px;
  padding:3px 6px; font:inherit; font-size:13px; text-align:right}
.filterbar .hint{font-size:12px; color:var(--muted)}
.sortsel{border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:8px; padding:6px 10px; font:inherit; font-size:13px; cursor:pointer}
.analyze{margin-top:10px; border:1px solid var(--navy); background:#fff; color:var(--navy);
  border-radius:6px; padding:5px 12px; font:inherit; font-size:12px; cursor:pointer}
.analyze:hover{background:var(--navy); color:#fff}
.analyze:disabled{opacity:.55; cursor:default}
.llm{margin-top:10px; padding:10px 12px; background:#F4F7FB; border:1px solid #DCE6F2;
  border-radius:8px; font-size:13px; line-height:1.65}
.llm b{color:var(--navy)} .llm div{margin-top:3px}
.llm .muted{color:var(--muted); font-size:12px}
.llm.hot{background:#FFF7E6; border-color:#E7C766}
.llm.err{background:#FDECEC; border-color:#E7A0A0; color:#8A1C1C}
.llm.err b{color:#8A1C1C}
.llm.stream .stphase{font-size:12px; color:var(--navy); font-weight:600}
.llm.stream details{margin-top:6px}
.llm.stream summary{cursor:pointer; font-size:12px; color:var(--muted)}
.llm.stream pre{white-space:pre-wrap; word-break:break-all; font-size:12px; line-height:1.5;
  max-height:150px; overflow:auto; margin:6px 0 0; padding:8px; background:#fff;
  border:1px solid #DCE6F2; border-radius:6px}
.llm.stream pre:empty{display:none}
.llm.stream .thinkbody{color:var(--muted); font-style:italic}
.card.focus{outline:3px solid var(--navy); outline-offset:2px;
  animation:focusPulse 1.2s ease-out 2}
@keyframes focusPulse{0%{box-shadow:0 0 0 0 rgba(0,32,96,.35)} 100%{box-shadow:0 0 0 14px rgba(0,32,96,0)}}
.llmfoot{margin-top:8px} .llmfoot .analyze{margin-top:0}
.units{margin-top:6px; padding-top:6px; border-top:1px dashed #C9D6E5}
.units .urow{font-size:13px; font-variant-numeric:tabular-nums}
.units .urow b{color:var(--ink)}
/* 납부 일정 */
.sched{margin-top:6px; padding-top:6px; border-top:1px dashed #C9D6E5}
.sched .srow{display:flex; align-items:baseline; gap:8px; font-size:13px;
  font-variant-numeric:tabular-nums; margin-top:2px}
.sched .swhen{flex:0 0 76px; color:var(--muted)}
.sched .slabel{flex:0 0 66px; color:var(--ink)}
.sched .srow b{color:var(--navy)}
/* 이전 결과 < > 페이저 */
.hpager{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; color:var(--muted)}
.hpager button{border:1px solid var(--line); background:#fff; color:var(--navy); cursor:pointer;
  border-radius:6px; width:22px; height:22px; line-height:1; font-size:14px; padding:0}
.hpager button:hover:not(:disabled){background:var(--navy); color:#fff}
.hpager button:disabled{opacity:.35; cursor:default}
/* 알림 끄기 버튼과 겹치지 않게 이름 여백 */
.body>.name{padding-right:88px}

.empty{padding:60px 0; text-align:center; color:var(--muted)}
.empty b{display:block; font-size:16px; color:var(--ink); margin-bottom:6px}

@media (max-width:520px){
  .card{flex-direction:column; gap:10px}
  .dday{flex-direction:row; gap:8px; border-right:0; border-bottom:1px solid var(--line);
    padding:0 0 10px; justify-content:flex-start; align-items:baseline}
  .dday .lbl{margin-top:0}
}
@media (prefers-reduced-motion:no-preference){
  .card{animation:in .25s ease both}
  @keyframes in{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">청약 <em>레이더</em></div>
    <div class="sync">
      <span id="syncInfo">동기화 대기 중</span>
      <button id="settingsBtn" type="button" title="공고문 분석 LLM 설정">⚙ LLM</button>
      <button id="refreshBtn" type="button">지금 수집</button>
    </div>
  </header>

  <div class="statusbar" id="statusbar"></div>

  <div class="settings" id="settingsPanel" hidden>
    <h3>공고문 분석 LLM (분양가/필요현금 계산)</h3>
    <label>제공자</label>
    <select id="setProvider">
      <option value="openai">직접 서버 (OpenAI 호환 · Kimi·gemma4 등)</option>
      <option value="">사용 안 함 (계약금 가정치만)</option>
    </select>
    <div class="row">
      <div><label>URL (base)</label><input id="setBaseUrl" placeholder="https://api.kimi.com/coding"></div>
      <div><label>모델</label><input id="setModel" placeholder="k3"></div>
      <div><label>temperature</label><input id="setTemp" placeholder="비우면 0 · kimi는 1 필수"></div>
    </div>
    <div class="row">
      <div><label>ID (Basic Auth)</label><input id="setUser" placeholder="demo"></div>
      <div><label>비밀번호</label><input id="setPass" type="password" placeholder=""></div>
    </div>
    <div id="apiKeyWrap"><label>API 키 (Bearer)</label><input id="setApiKey" type="password" placeholder=""></div>
    <button class="save" id="setSave" type="button">저장</button>
    <span id="setStatus" class="hint"></span>
    <div class="hint">cloudflared quick tunnel은 URL·비번이 재시작마다 바뀝니다. 바뀌면 여기서 갱신하세요.<br>설정은 DB(/data)에 저장되어 이미지·소스 업데이트에도 유지됩니다.</div>
  </div>

  <div class="toolbar">
    <div id="catTabs" class="tabs" role="group" aria-label="공고 종류 필터">
      <button data-c="all" aria-pressed="true" type="button">전체</button>
      <button data-c="sale" aria-pressed="false" type="button">분양</button>
      <button data-c="remndr" aria-pressed="false" type="button">무순위</button>
      <button data-c="rent" aria-pressed="false" type="button">임대</button>
    </div>
    <div id="statTabs" class="tabs" role="group" aria-label="공고 상태 필터">
      <button data-f="active" aria-pressed="true" type="button">접수·예정</button>
      <button data-f="open" aria-pressed="false" type="button">접수중</button>
      <button data-f="upcoming" aria-pressed="false" type="button">예정</button>
      <button data-f="done" aria-pressed="false" type="button">마감</button>
      <button data-f="all" aria-pressed="false" type="button">전체</button>
    </div>
    <select id="sortSel" class="sortsel" aria-label="정렬">
      <option value="deadline">마감임박순</option>
      <option value="recent">최신 공고순</option>
    </select>
  </div>

  <div class="filterbar">
    <label class="fchk"><input type="checkbox" id="cmOn" checked> 🚇 목적지
      <input type="number" id="cmVal" min="10" step="5" value="60"> 분 이내</label>
    <label class="fchk"><input type="checkbox" id="areaOn" checked> 전용
      <input type="number" id="areaVal" min="0" step="1" value="30"> ㎡ 이상</label>
    <label class="fchk"><input type="checkbox" id="cashOn"> 필요현금
      <input type="number" id="cashVal" min="0" step="0.5" value="2"> 억 이하</label>
    <span class="hint" id="filterHint"></span>
  </div>

  <div id="list"></div>
</div>

<script>
let NOTICES = [], FILTER = 'active', CAT = 'all', SORT = 'deadline', TODAY = new Date();
// 값 필터(면적·필요현금) — 각각 켜기/끄기 + 값 조정, 동시 적용. localStorage에 저장.
// 전용 30㎡ 이하(원룸급)는 분석되면 제외 — 기본 켜짐. 미분석은 값을 몰라 통과.
let AREA_ON = true, AREA_VAL = 30, CASH_ON = false, CASH_VAL = 20000; // CASH_VAL은 만원
let CM_ON = true, CM_VAL = 60;  // 목적지 통근 N분 이내(기본 켜짐)
const $ = s => document.querySelector(s);
/* 공고 종류: 분양(applyhome·lh) / 무순위(applyhome_remndr) / 임대(applyhome_rent·board) */
function catOf(n){
  if(n.source==='applyhome_remndr') return 'remndr';
  if(['applyhome_rent','board','lh_rent','gh'].includes(n.source)) return 'rent';
  return 'sale';
}
function urgencyOf(j){ if(j.k==='done') return 99999; if(j.num==='오늘') return 0;
  const m=/D-(\d+)/.exec(j.num); return m?parseInt(m[1]):900; }

function pd(s){ if(!s) return null; const d = new Date(String(s).slice(0,10)+'T00:00:00'); return isNaN(d) ? null : d; }
function days(d){ return Math.round((d - new Date(TODAY.toDateString())) / 86400000); }

/* 상태 판정: 접수중 > 예정(D-n) > 발표대기 > 마감 */
function judge(n){
  const L = n.llm || {};  // 임대는 LLM이 뽑은 신청기간을 1순위 창으로 사용
  const wins = [[n.sp_start,n.sp_end,'특별공급'],[L.apply_start||n.r1_start,L.apply_end||n.r1_end,'1순위'],[n.r2_start,n.r2_end,'2순위']];
  for(const [a,b] of wins){
    const s = pd(a), e = pd(b) || s;
    if(s && days(s) <= 0 && e && days(e) >= 0)
      return {k:'open', num: days(e)===0 ? '오늘' : 'D-'+days(e), lbl:'접수 마감까지'};
  }
  let nearest = null;
  for(const [a,,name] of wins){
    const s = pd(a);
    if(s && days(s) > 0 && (!nearest || s < nearest.d)) nearest = {d:s, name};
  }
  if(nearest){
    const dd = days(nearest.d);
    return {k: dd<=3 ? 'soon':'later', num:'D-'+dd, lbl:nearest.name+' 시작'};
  }
  const w = pd(n.winner_date);
  // 접수는 끝나고 발표만 남은 상태 → 접수·예정이 아니라 별도(마감 탭에 노출)
  if(w && days(w) >= 0) return {k:'result', num:'D-'+days(w), lbl:'당첨 발표'};
  // 날짜가 아예 없는 임대만 중립('접수 확인'). 신청기간이 있는데 여기까지 왔으면 지난 것=마감
  if(n.source === 'board' && !(n.sp_start || L.apply_start || n.r1_start || n.r2_start))
    return {k:'later', num:'공고', lbl:'접수 확인'};
  return {k:'done', num:'—', lbl:'마감'};
}

function stepCls(a,b){
  const s = pd(a), e = pd(b) || s;
  if(s && days(s)<=0 && e && days(e)>=0) return 'now';
  if(s && days(s)>0) return 'next';
  return '';
}
function fr(a,b){ if(!a) return null; a=String(a).slice(5,10).replace('-','.'); b=b?String(b).slice(5,10).replace('-','.'):null; return b&&b!==a ? a+'~'+b : a; }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function card(n){
  const j = judge(n);
  const nm = n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.name)}</a>` : esc(n.name);
  const muteBtn = `<button class="mutebtn${n.muted?' on':''}" onclick="toggleMute('${n.id}')" title="${n.muted?'알림 켜기':'알림 끄기(관심 없음 → 접기)'}">${n.muted?'🔔 알림 켜기':'🔕 알림 끄기'}</button>`;
  // 알림 끈(관심 없는) 공고는 이름만 남기고 접는다.
  if(n.muted){
    return `<div class="card muted" data-k="${j.k}" data-nid="${esc(n.id)}">
      <div class="dday ${j.k}"><span class="lbl">꺼짐</span></div>
      <div class="body">${muteBtn}
        <div class="name">${nm}</div>
        <div class="muted-note">🔕 알림 꺼짐 · 관심 없음으로 접음</div>
      </div>
    </div>`;
  }
  const L = n.llm || {};
  const steps = [];
  const add = (name,a,b) => { const r = fr(a,b); if(r) steps.push(`<span class="step ${stepCls(a,b)}">${name} <b>${r}</b></span>`); };
  add('특공', n.sp_start, n.sp_end);
  add(n.source==='board'?'신청':'1순위', L.apply_start||n.r1_start, L.apply_end||n.r1_end);
  add('2순위', n.r2_start, n.r2_end);
  if(n.winner_date) steps.push(`<span class="step">발표 <b>${esc(String(n.winner_date).slice(5,10).replace('-','.'))}</b></span>`);
  const tcls = t => t.includes('⚠')?'warn' : t.includes('🔥')?'hot' : (t.includes('💰')||t.includes('🏠'))?'cost' : '';
  const tags = (n.tags||[]).map(t=>`<span class="tag ${tcls(t)}">${esc(t)}</span>`).join('');
  const supply = n.total_supply ? ' · '+n.total_supply+'세대' : '';
  const mq = n.address || n.name || '';
  const mapBtn = mq ? ` · <a class="maplink" href="https://map.kakao.com/link/search/${encodeURIComponent(mq)}" target="_blank" rel="noopener">🗺 지도</a>` : '';
  return `<div class="card" data-k="${j.k}" data-nid="${esc(n.id)}">
    <div class="dday ${j.k}"><span class="num">${j.num==='오늘'?'오늘':j.num}</span><span class="lbl">${j.lbl}</span></div>
    <div class="body">${muteBtn}
      <div class="name">${nm}</div>
      <div class="meta">${esc(n.region||'')} · ${esc(n.house_kind||'')}${supply}${mapBtn}</div>
      ${steps.length ? `<div class="timeline">${steps.join('')}</div>` : ''}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${llmHtml(n)}
    </div>
  </div>`;
}

/* LLM 분석 결과 박스 또는 '분석' 버튼 */
function money(v){ v=Math.round(v); const e=Math.floor(v/10000), m=v%10000;
  return e&&m ? `${e}억 ${m.toLocaleString()}만` : e ? `${e}억` : `${m.toLocaleString()}만`; }
function llmSummary(L){
  if(!L) return '정보없음';
  if(L.kind==='rent') return [L.deposit_manwon?'보증금 '+money(L.deposit_manwon):'', L.monthly_manwon?'월'+L.monthly_manwon:''].filter(Boolean).join(' ')||'임대';
  return '필요현금 '+money(L.equity);
}
function whenFmt(w){ w=String(w||'').trim(); const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(w); return m?`${m[1].slice(2)}.${m[2]}.${m[3]}`:w; }
/* 납부 일정: 언제(회차) · 얼마(최저 분양가×%) · 비율 */
function scheduleHtml(L){
  const S = L.schedule||[]; if(!S.length) return '';
  const rows = S.map(s=>{
    const amt = (L.price_lo && s.pct) ? ' · <b>'+money(L.price_lo*s.pct/100)+'</b>' : '';
    const pct = (s.pct!=null && s.pct!=='') ? ` <span class="muted">${s.pct}%</span>` : '';
    return `<div class="srow"><span class="swhen">${esc(whenFmt(s.when))||'-'}</span><span class="slabel">${esc(s.label||'')}</span>${amt}${pct}</div>`;
  }).join('');
  return `<div class="sched"><div class="muted">🗓 납부 일정 <span style="font-weight:400">(분양가 최저 ${money(L.price_lo)} 기준)</span></div>${rows}</div>`;
}
/* LLM 결과 1건의 본문(임대/분양) */
function llmBox(L){
  if(L.kind==='rent'){
    const p=[]; if(L.deposit_manwon)p.push('보증금 '+money(L.deposit_manwon));
    if(L.monthly_manwon)p.push('월 '+L.monthly_manwon+'만'); if(L.area_m2)p.push('전용 '+L.area_m2+'㎡');
    let inner = `<b>🏠 임대조건</b> ${esc(p.join(' · '))||'-'}`;
    if(L.apply_start) inner += `<div>신청 ${fr(L.apply_start,L.apply_end)||esc(L.apply_start)}</div>`;
    // 입주 가능일 / 거주기간
    const io=[]; if(L.move_in)io.push('입주 '+esc(whenFmt(L.move_in))); if(L.lease_term)io.push('거주 '+esc(L.lease_term));
    if(io.length) inner += `<div class="muted">${io.join(' · ')}</div>`;
    // 계약 시 필요현금(계약금=보증금×계약금율) + 입주 시 잔금
    if(L.deposit_manwon){
      const cp = L.contract_pct || 10, down = Math.round(L.deposit_manwon*cp/100);
      inner += `<div><b>💵 계약 시 필요현금</b> ${money(down)} `
        + `<span class="muted">(계약금 ${cp}%) · 입주 시 잔금 ${money(L.deposit_manwon-down)}</span></div>`;
    }
    if(L.rank_advice) inner += `<div><b>🤖 자격</b> ${esc(L.rank_advice)}</div>`;
    if(L.note) inner += `<div class="muted">${esc(L.note)}</div>`;
    return inner + unitsHtml(L);
  }
  const price = L.price_lo===L.price_hi ? money(L.price_lo) : money(L.price_lo)+'~'+money(L.price_hi);
  const reg = L.hopetown?'신희타 모기지':(L.regulated?'규제':'비규제');
  const cap = L.cap_hit ? ' 대출 '+money(L.loan)+' 상한' : '';
  const ar = L.area_lo ? (L.area_lo===L.area_hi ? ` · 전용 ${L.area_lo}㎡` : ` · 전용 ${L.area_lo}~${L.area_hi}㎡`) : '';
  let inner = `<b>💰 필요현금</b> ${L.highlight?'🔥 ':''}${money(L.equity)} <span class="muted">(${reg} LTV${L.ltv_pct}%${cap})</span>`
    + `<div class="muted">분양가 ${price}${ar} · 계약 최소현금 ${money(L.entry_cash)}(계약금 ${L.contract_pct}%${L.estimated?' 가정':''})</div>`;
  inner += scheduleHtml(L);
  if(L.rank_advice) inner += `<div><b>🤖 순위</b> ${esc(L.rank_advice)}</div>`;
  return inner + unitsHtml(L);
}
/* 분석 중 실시간 패널 — SSE 이벤트가 id(stphase/stthink/stout + 공고id)로 직접 갱신 */
function streamHtml(n){
  return `<div class="llm stream">
    <div class="stphase" id="stphase${n.id}">연결 중…</div>
    <details open><summary>💭 생각 과정 (실시간)</summary><pre class="thinkbody" id="stthink${n.id}"></pre></details>
    <pre id="stout${n.id}"></pre>
  </div>`;
}
function llmHtml(n){
  // LLM 서버가 죽었을 때: 공고를 없애지 않고 배너로 안내(버튼은 '다시 시도'로 유지)
  const errBanner = n._llmError
    ? `<div class="llm err">⚠️ <b>LLM 서버 응답 없음</b> — 분석하지 못했습니다. 서버(Kimi) 상태를 확인한 뒤 다시 시도하세요.</div>`
    : '';
  if(n._loading) return errBanner + streamHtml(n);  // SSE 실시간 패널(단계·생각·출력)
  if(!n.enriched) return errBanner + `<button class="analyze" onclick="enrichNotice('${n.id}')">${n._llmError?'🔁 다시 시도':'🔄 LLM 분석'}</button>`;
  const again = n._loading ? `<span class="muted">🔄 분석 중…</span>`
    : `<button class="analyze" onclick="enrichNotice('${n.id}',true)">🔄 다시</button>`;
  // 결과 목록: 히스토리(최근 3개, 0=최신) 우선. 없으면 현재 결과 1건.
  const hist = (n.llm_history && n.llm_history.length) ? n.llm_history
             : (n.llm ? [{at:'', r:n.llm}] : []);
  if(!hist.length) return errBanner + `<div class="llm"><span class="muted">분석함 · 정보를 못 찾음</span><div class="llmfoot">${again}</div></div>`;
  const idx = Math.min(Math.max(n._hidx||0, 0), hist.length-1);
  const entry = hist[idx], L = entry.r;
  const pager = hist.length>1 ? `<div class="hpager">
      <button onclick="histNav('${n.id}',1)" ${idx>=hist.length-1?'disabled':''} title="이전 결과">‹</button>
      <span>${idx+1}/${hist.length}${entry.at?` · ${esc(entry.at.slice(5,16))}`:''}${idx>0?' (이전)':''}</span>
      <button onclick="histNav('${n.id}',-1)" ${idx<=0?'disabled':''} title="다음(최신) 결과">›</button>
    </div>` : '';
  if(!L) return errBanner + `<div class="llm">${pager}<span class="muted">분석함 · 정보를 못 찾음</span><div class="llmfoot">${again}</div></div>`;
  const hot = (idx===0 && L.highlight) ? ' hot' : '';
  return errBanner + `<div class="llm${hot}">${pager}${llmBox(L)}<div class="llmfoot">${again}</div></div>`;
}
function histNav(id, delta){
  const n = NOTICES.find(x=>x.id===id); if(!n) return;
  const len = (n.llm_history && n.llm_history.length) ? n.llm_history.length : 1;
  n._hidx = Math.min(Math.max((n._hidx||0)+delta, 0), len-1);
  render();
}
function unitsHtml(L){
  const U = L.units||[]; if(!U.length) return '';
  const rows = U.map(u=>{
    const sup = u.supply_total ? ` · <b>${u.supply_total}세대</b>` : '';
    if(L.kind==='rent'){
      const m = u.monthly ? ' / 월 '+u.monthly+'만' : '';
      return `<div class="urow">전용 ${u.area}㎡ · 보증금 ${money(u.deposit)}${m}${sup}</div>`;
    }
    const det = (u.supply_general!=null||u.supply_special!=null)
      ? ` <span class="muted">(일반 ${u.supply_general||0}·특공 ${u.supply_special||0})</span>` : '';
    return `<div class="urow">전용 ${u.area}㎡ · 필요현금 ${money(u.cash)}${sup}${det}</div>`;
  }).join('');
  const label = L.remndr ? '평형별' : '평형별 (전용 49㎡↑)';
  return `<div class="units"><div class="muted">${label}</div>${rows}</div>`;
}
async function enrichNotice(id, force){
  const n = NOTICES.find(x=>x.id===id); if(!n) return;
  n._loading = true; n._llmError = null; render();
  const el = k => document.getElementById(k + id);
  const append = (e, t) => { if(e){ e.textContent += t; e.scrollTop = e.scrollHeight; } };
  try{
    const res = await fetch('/api/enrich',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, force: !!force, stream: true})});
    if(!res.ok || !res.body) throw new Error('bad response');
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for(;;){                                   // SSE 수동 파싱(POST라 EventSource 불가)
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while((i = buf.indexOf('\n\n')) >= 0){
        const raw = buf.slice(0, i); buf = buf.slice(i+2);
        const line = raw.split('\n').find(l => l.startsWith('data:'));
        if(!line) continue;
        let ev; try{ ev = JSON.parse(line.slice(5)); }catch{ continue; }
        if(ev.phase){ const e = el('stphase'); if(e) e.textContent = ev.phase; }
        else if(ev.thinking) append(el('stthink'), ev.thinking);
        else if(ev.content) append(el('stout'), ev.content);
        else if(ev.error){ n._llmError = ev.error; }
        else if('done' in ev){
          n.enriched = true; n.llm = ev.llm || null; n._hidx = 0;  // 새 분석 → 최신 결과로
          if(ev.llm_history) n.llm_history = ev.llm_history;
        }
      }
    }
  }catch(e){ n._llmError = 'network'; }  // 우리 서버조차 응답 없음
  n._loading = false; render();
}
async function toggleMute(id){
  const n = NOTICES.find(x=>x.id===id); if(!n) return;
  const next = !n.muted;
  n.muted = next; render();                 // 낙관적 갱신(즉시 접기/펼치기)
  try{
    await fetch('/api/mute',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, muted: next})});
  }catch(e){ n.muted = !next; render(); }    // 실패 시 롤백
}

/* 값 필터용: 공고의 최대 전용면적(평형별 units → 분양 area_hi → 임대 대표 area_m2) */
function maxArea(n){
  const L = n.llm; if(!L) return null;
  let mx = 0; for(const u of (L.units||[])) if(u.area > mx) mx = u.area;
  if(!mx) mx = L.area_hi || L.area_m2 || 0;
  return mx || null;
}
/* 값 필터용: 필요한 현금 — 분양=필요현금(equity), 임대=보증금 */
function cashNeeded(n){
  const L = n.llm; if(!L) return null;
  if(L.kind==='rent') return L.deposit_manwon ?? null;
  return L.equity ?? null;
}
/* 값 필터는 '분석된 공고'에만 적용(미분석은 값을 몰라 통과시켜 목록에 남긴다) */
function passValueFilters(n){
  // 통근: 계산된 공고만 적용. 주소 미확인(commute_min 없음)은 그대로 남긴다.
  if(CM_ON && n.commute_min != null && n.commute_min > CM_VAL) return false;
  if(AREA_ON && n.enriched && n.llm){
    const a = maxArea(n);  // 면적을 못 뽑은 공고(null)는 판단 불가 → 남긴다
    if(a != null && a < AREA_VAL) return false;
  }
  if(CASH_ON && n.enriched && n.llm){
    const c = cashNeeded(n);
    if(c != null && c > CASH_VAL) return false;
  }
  return true;
}

function render(){
  const map = {active:['open','soon','later'], open:['open'], upcoming:['soon','later'], done:['result','done'], all:['open','soon','later','result','done']};
  const rows = NOTICES.map(n=>({n, j:judge(n)}))
    .filter(x=>CAT==='all' || catOf(x.n)===CAT)
    .filter(x=>map[FILTER].includes(x.j.k))
    .filter(x=>passValueFilters(x.n))
    .sort((a,b)=>{
      const ord = {open:0, soon:1, later:2, result:3, done:4};
      if(ord[a.j.k]!==ord[b.j.k]) return ord[a.j.k]-ord[b.j.k];
      if(SORT==='deadline') return urgencyOf(a.j)-urgencyOf(b.j);
      return 0;  // 최신 공고순: 서버 정렬(게시일 desc) 유지
    });
  $('#list').innerHTML = rows.length
    ? rows.map(x=>card(x.n)).join('')
    : `<div class="empty"><b>표시할 공고가 없습니다</b>필터를 조정하거나 '지금 수집'을 눌러보세요.</div>`;
  const fh = $('#filterHint');
  if(fh) fh.textContent = (AREA_ON || CASH_ON || CM_ON)
    ? '※ 값을 아는 공고에만 적용됩니다(미분석·주소 미확인은 그대로 표시).' : '';
}

async function loadStatus(){
  const s = await (await fetch('/api/status')).json();
  TODAY = new Date(s.today+'T00:00:00');
  $('#syncInfo').textContent = s.last_sync ? `마지막 동기화 ${s.last_sync.slice(5,16)} · ${s.last_sync_counts||''}` : '아직 동기화 전';
  const pills = [];
  pills.push(`<span class="pill">${s.mode==='premarital'?'혼인신고 전 모드':'기혼 모드'}</span>`);
  pills.push(`<span class="pill ${s.telegram_configured?'ok':'warn'}">텔레그램 ${s.telegram_configured?'연결됨':'미설정'}</span>`);
  pills.push(`<span class="pill ${s.applyhome_key?'ok':'warn'}">청약홈 키 ${s.applyhome_key?'OK':'없음'}</span>`);
  pills.push(`<span class="pill ${s.lh_key?'ok':'warn'}">LH 키 ${s.lh_key?'OK':'없음'}</span>`);
  if(s.mock) pills.push(`<span class="pill warn">MOCK 모드</span>`);
  $('#statusbar').innerHTML = pills.join('');
}

async function loadNotices(){
  NOTICES = await (await fetch('/api/notices')).json();
  render();
}

/* 알림(텔레그램) 링크의 #id=… 로 들어오면 해당 공고 카드로 스크롤+강조 */
function cardEl(id){ return $('#list').querySelector('.card[data-nid="'+id.replace(/(["\\])/g,'\\$1')+'"]'); }
function syncTabs(){
  document.querySelectorAll('#statTabs button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.f===FILTER)));
  document.querySelectorAll('#catTabs button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.c===CAT)));
}
function focusFromHash(){
  const m = /[#&]id=([^&]*)/.exec(location.hash || '');
  if(!m) return;
  const id = decodeURIComponent(m[1]);
  if(!NOTICES.some(x=>x.id===id)) return;   // 아직 수집 안 된 공고
  let el = cardEl(id);
  if(!el){                                   // 필터에 가려 있으면 전체 보기로 열어줌
    FILTER = 'all'; CAT = 'all'; syncTabs(); render(); el = cardEl(id);
  }
  if(el){
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.remove('focus'); void el.offsetWidth;  // 재클릭 시 애니메이션 재생
    el.classList.add('focus');
  }
}
window.addEventListener('hashchange', focusFromHash);

function wireTabs(sel, apply){
  const btns = document.querySelectorAll(sel+' button');
  btns.forEach(b=>b.addEventListener('click', ()=>{
    btns.forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    apply(b); render();
  }));
}
wireTabs('#statTabs', b=>{ FILTER = b.dataset.f; });
wireTabs('#catTabs', b=>{ CAT = b.dataset.c; });
$('#sortSel').addEventListener('change', e=>{ SORT = e.target.value; render(); });

/* 값 필터: 저장된 값 복원 → UI 반영 → 변경 시 저장+렌더 */
function loadFilterPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem('cr_filters2') || '{}');
    if(typeof p.areaOn==='boolean') AREA_ON = p.areaOn;
    if(p.areaVal > 0) AREA_VAL = p.areaVal;
    if(typeof p.cashOn==='boolean') CASH_ON = p.cashOn;
    if(p.cashVal >= 0) CASH_VAL = p.cashVal;
    if(typeof p.cmOn==='boolean') CM_ON = p.cmOn;
    if(p.cmVal > 0) CM_VAL = p.cmVal;
  }catch(e){}
  $('#areaOn').checked = AREA_ON; $('#areaVal').value = AREA_VAL;
  $('#cashOn').checked = CASH_ON; $('#cashVal').value = CASH_VAL/10000;
  $('#cmOn').checked = CM_ON; $('#cmVal').value = CM_VAL;
}
function saveFilterPrefs(){
  localStorage.setItem('cr_filters2', JSON.stringify(
    {areaOn:AREA_ON, areaVal:AREA_VAL, cashOn:CASH_ON, cashVal:CASH_VAL,
     cmOn:CM_ON, cmVal:CM_VAL}));
}
function onFilterChange(){
  AREA_ON = $('#areaOn').checked;
  AREA_VAL = parseFloat($('#areaVal').value) || 0;
  CASH_ON = $('#cashOn').checked;
  CASH_VAL = Math.round((parseFloat($('#cashVal').value) || 0) * 10000); // 억 → 만원
  CM_ON = $('#cmOn').checked;
  CM_VAL = parseFloat($('#cmVal').value) || 0;
  saveFilterPrefs(); render();
}
['areaOn','areaVal','cashOn','cashVal','cmOn','cmVal'].forEach(id=>{
  $('#'+id).addEventListener('input', onFilterChange);
  $('#'+id).addEventListener('change', onFilterChange);
});
loadFilterPrefs();

$('#refreshBtn').addEventListener('click', async ()=>{
  $('#refreshBtn').disabled = true; $('#refreshBtn').textContent = '수집 중…';
  try{ await fetch('/api/refresh', {method:'POST'}); await loadStatus(); await loadNotices(); }
  finally{ $('#refreshBtn').disabled = false; $('#refreshBtn').textContent = '지금 수집'; }
});

/* LLM 설정 패널 */

  const s = await (await fetch('/api/settings')).json();
  $('#setProvider').value = s.provider || '';

$('#settingsBtn').addEventListener('click', ()=>{
  const el = $('#settingsPanel'); el.hidden = !el.hidden;
  if(!el.hidden) loadSettings();
});
$('#setSave').addEventListener('click', async ()=>{
  $('#setStatus').textContent = '저장 중…';

loadStatus().then(loadNotices).then(focusFromHash);
setInterval(()=>{ loadStatus(); loadNotices(); }, 5*60*1000);
</script>
